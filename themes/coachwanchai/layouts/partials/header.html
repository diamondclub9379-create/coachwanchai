<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">
      <span class="logo-icon">CW</span>
      <span class="logo-text">Coach Wanchai</span>
    </a>
    <nav class="main-nav" id="mainNav">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" class="nav-link{{ if $.IsMenuCurrent "main" . }} active{{ end }}">{{ .Name }}</a>
      {{ end }}
    </nav>
    <a href="/cart/" class="cart-icon" id="cartIcon" aria-label="ตะกร้าสินค้า">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="เปิดเมนู">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
